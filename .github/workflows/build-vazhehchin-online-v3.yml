name: Build REAL ONLINE Vazhehchin v3 (NO OLD ZIP)

on:
  push:
    paths:
      - '.github/workflows/build-vazhehchin-online-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-online-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the online app from this file ONLY. NO existing ZIP is used.
      - name: Generate fresh Android app with REAL online server
        shell: bash
        run: |
          mkdir -p fresh-online-app/app/src/main/java/ir/vazhehchin/game fresh-online-app/app/src/main/res/drawable
          cat > fresh-online-app/settings.gradle <<'GRADLE_SETTINGS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'VazhehchinOnline'
          include ':app'
          GRADLE_SETTINGS
          cat > fresh-online-app/build.gradle <<'GRADLE_ROOT'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE_ROOT
          cat > fresh-online-app/gradle.properties <<'GRADLE_PROPERTIES'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          GRADLE_PROPERTIES
          cat > fresh-online-app/app/build.gradle <<'GRADLE_APP'
          plugins { id 'com.android.application' }
          android {
              namespace 'ir.vazhehchin.game'
              compileSdk 35
              defaultConfig {
                  applicationId 'ir.vazhehchin.game'
                  minSdk 24
                  targetSdk 35
                  versionCode 30
                  versionName '3.0.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE_APP
          cat > fresh-online-app/app/src/main/AndroidManifest.xml <<'MANIFEST_XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="واژه‌چین" android:icon="@drawable/ic_launcher"
                           android:usesCleartextTraffic="false" android:allowBackup="false"
                           android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                            android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_XML
          cat > fresh-online-app/app/src/main/res/drawable/ic_launcher.xml <<'ICON_XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp"
                  android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#155AB3" android:pathData="M16,0 H92 Q108,0 108,16 V92 Q108,108 92,108 H16 Q0,108 0,92 V16 Q0,0 16,0 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M35,30 H73 V44 H66 C61,44 59,48 59,52 C59,56 61,60 66,60 H73 V78 H35 V61 H44 C49,61 52,57 52,52 C52,47 49,44 44,44 H35 Z" />
          </vector>
          ICON_XML
          cat > fresh-online-app/app/src/main/java/ir/vazhehchin/game/MainActivity.java <<'MAIN_ACTIVITY_JAVA'
          package ir.vazhehchin.game;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.ValueCallback;
          
          /** Only loads the REAL online Node.js game. Never silently starts a bot match. */
          public final class MainActivity extends Activity {
              private static final String URL = "https://vazhehchin-android.onrender.com/";
              private static final String HOST = "vazhehchin-android.onrender.com";
              private static final int PICK_PHOTO = 8721;
              private WebView web;
              private LinearLayout waiting;
              private TextView status, help;
              private ValueCallback<Uri[]> upload;
              private boolean pageError = false;
          
              private int dp(int n) { return Math.round(n * getResources().getDisplayMetrics().density); }
          
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(232,242,255));
                  getWindow().setNavigationBarColor(Color.rgb(232,242,255));
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                                                                   View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(238,246,255));
                  web = new WebView(this);
                  FrameLayout.LayoutParams webBox = new FrameLayout.LayoutParams(-1,-1);
                  webBox.topMargin = dp(40);
                  root.addView(web,webBox);
                  status = new TextView(this);
                  status.setGravity(Gravity.CENTER);
                  status.setTextSize(12);
                  status.setTextColor(Color.rgb(19,64,121));
                  status.setBackgroundColor(Color.rgb(222,239,255));
                  status.setText("واژه‌چین • نسخه ۳.۰.۰ • در حال اتصال به مسابقه آنلاین...");
                  root.addView(status,new FrameLayout.LayoutParams(-1,dp(40),Gravity.TOP));
                  waiting = new LinearLayout(this);
                  waiting.setOrientation(LinearLayout.VERTICAL);
                  waiting.setGravity(Gravity.CENTER);
                  waiting.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  waiting.setPadding(dp(22),dp(30),dp(22),dp(30));
                  waiting.setBackgroundColor(Color.rgb(238,246,255));
                  FrameLayout.LayoutParams waitingBox = new FrameLayout.LayoutParams(-1,-1);
                  waitingBox.topMargin = dp(40);
                  root.addView(waiting,waitingBox);
                  help = new TextView(this);
                  help.setTextSize(18);
                  help.setTextColor(Color.rgb(24,55,99));
                  help.setGravity(Gravity.CENTER);
                  waiting.addView(help,new LinearLayout.LayoutParams(-1,-2));
                  Button retry = new Button(this);
                  retry.setText("🌐 تلاش مجدد برای ورود به مسابقه آنلاین");
                  LinearLayout.LayoutParams retryParams = new LinearLayout.LayoutParams(-1,-2);
                  retryParams.topMargin = dp(20);
                  waiting.addView(retry,retryParams);
                  retry.setOnClickListener(v->connect());
          
                  setContentView(root);
                  WebSettings cfg = web.getSettings();
                  cfg.setJavaScriptEnabled(true);
                  cfg.setDomStorageEnabled(true);
                  cfg.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  cfg.setMediaPlaybackRequiresUserGesture(false);
                  cfg.setJavaScriptCanOpenWindowsAutomatically(false);
                  cfg.setAllowFileAccess(false);
                  cfg.setAllowContentAccess(true); // Android profile photo picker
                  cfg.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  web.clearCache(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public void onPageStarted(WebView v,String u,android.graphics.Bitmap icon) {
                          pageError = false;
                          if (u!=null && u.startsWith(URL)) showWaiting(false,"⏳ در حال بازکردن بازی آنلاین...\nسرور رایگان ممکن است برای اولین اتصال حدود یک دقیقه زمان نیاز داشته باشد.");
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r) {
                          Uri uri=r.getUrl();
                          return !("https".equals(uri.getScheme()) && HOST.equals(uri.getHost()));
                      }
                      @Override public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e) {
                          if(r.isForMainFrame()) {
                              pageError=true;
                              showWaiting(true,"🔴 سرور آنلاین باز نشد.\nVPN گوشی را روشن کن و «تلاش مجدد» را بزن.\nکد خطا: "+e.getErrorCode());
                          }
                      }
                      @Override public void onReceivedHttpError(WebView v,WebResourceRequest r,WebResourceResponse e) {
                          if(r.isForMainFrame() && e.getStatusCode()>=400) {
                              pageError=true;
                              showWaiting(true,"🔴 پاسخ سرور ناموفق بود: "+e.getStatusCode()+"\nکمی بعد دوباره تلاش کن.");
                          }
                      }
                      @Override public void onPageFinished(WebView v,String u) {
                          if(pageError || u==null || !u.startsWith(URL))return;
                          // Browser error pages or local demo HTML must never pass this test.
                          v.evaluateJavascript("(function(){return document.documentElement.dataset.serverBackend==='true' && !!document.getElementById('joinOnlineBtn') && document.getElementById('joinOnlineBtn').textContent.indexOf('پیدا کردن حریف')>=0})()", value->{
                              if(pageError)return;
                              if("true".equals(value)) {
                                  status.setText("🟢 واژه‌چین آنلاین ۳.۰ • سرور متصل • حریف واقعی");
                                  status.setBackgroundColor(Color.rgb(218,248,224));
                                  waiting.setVisibility(View.GONE);
                                  web.setVisibility(View.VISIBLE);
                              } else showWaiting(true,"🔴 نسخه مسابقه واقعی از سرور دریافت نشد.\nاین اپلیکیشن با کامپیوتر مسابقه نمی‌دهد.\nلطفاً دوباره امتحان کن.");
                          });
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> callback,FileChooserParams params) {
                          if(upload!=null)upload.onReceiveValue(null);
                          upload=callback;
                          Intent intent=new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          try { startActivityForResult(Intent.createChooser(intent,"انتخاب عکس پروفایل"),PICK_PHOTO);return true; }
                          catch(ActivityNotFoundException ex) { upload=null;callback.onReceiveValue(null);return false; }
                      }
                  });
                  connect();
              }
              private void showWaiting(boolean failure,String message) {
                  if(status==null || waiting==null)return;
                  status.setText(failure ? "🔴 واژه‌چین ۳.۰ • اتصال قطع است" : "⏳ واژه‌چین ۳.۰ • اتصال به سرور...");
                  status.setBackgroundColor(Color.rgb(222,239,255));
                  help.setText(message);
                  waiting.setVisibility(View.VISIBLE);
                  web.setVisibility(View.INVISIBLE);
              }
              private void connect() {
                  pageError=false;
                  showWaiting(false,"⏳ در حال اتصال به سرور واقعی واژه‌چین...\nاگر سرور با VPN باز می‌شود، VPN گوشی را روشن نگه دار.");
                  web.loadUrl(URL+"?android_version=3.0.0");
              }
              @Override protected void onActivityResult(int request,int result,Intent data) {
                  super.onActivityResult(request,result,data);
                  if(request==PICK_PHOTO && upload!=null) {
                      Uri[] files=result==RESULT_OK && data!=null && data.getData()!=null ? new Uri[]{data.getData()} : null;
                      upload.onReceiveValue(files);
                      upload=null;
                  }
              }
              @Override protected void onPause() {if(web!=null)web.onPause();super.onPause();}
              @Override protected void onResume() {super.onResume();if(web!=null)web.onResume();}
              @Override protected void onDestroy() {if(upload!=null)upload.onReceiveValue(null);if(web!=null)web.destroy();super.onDestroy();}
          }
          MAIN_ACTIVITY_JAVA

      - name: Check ONLINE identity before compiling
        run: |
          set -eu
          grep -Fq "applicationId 'ir.vazhehchin.game'" fresh-online-app/app/build.gradle
          grep -Fq "versionCode 30" fresh-online-app/app/build.gradle
          grep -Fq "versionName '3.0.0'" fresh-online-app/app/build.gradle
          grep -Fq 'https://vazhehchin-android.onrender.com/' fresh-online-app/app/src/main/java/ir/vazhehchin/game/MainActivity.java
          grep -Fq 'dataset.serverBackend' fresh-online-app/app/src/main/java/ir/vazhehchin/game/MainActivity.java
          grep -Fq 'پیدا کردن حریف' fresh-online-app/app/src/main/java/ir/vazhehchin/game/MainActivity.java
          echo 'OK: source is REAL ONLINE v3, no archive used.'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile ONLINE APK
        run: gradle --no-daemon -p fresh-online-app :app:assembleDebug

      - name: Verify ONLINE APK version and output
        run: |
          set -eu
          APK=fresh-online-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > fresh-online-app/apk-info.txt
          cat fresh-online-app/apk-info.txt | head -n 8
          grep -Fq "name='ir.vazhehchin.game'" fresh-online-app/apk-info.txt
          grep -Fq "versionCode='30'" fresh-online-app/apk-info.txt
          grep -Fq "versionName='3.0.0'" fresh-online-app/apk-info.txt
          cp "$APK" fresh-online-app/Vazhehchin-REAL-ONLINE-v3.apk
          sha256sum fresh-online-app/Vazhehchin-REAL-ONLINE-v3.apk
          echo 'OK: ONLINE v3 signed debug APK is ready'

      - name: Download only the VERIFIED online APK
        uses: actions/upload-artifact@v4
        with:
          name: Vazhehchin-REAL-ONLINE-v3-APK
          path: |
            fresh-online-app/Vazhehchin-REAL-ONLINE-v3.apk
            fresh-online-app/apk-info.txt
          if-no-files-found: error
          retention-days: 30
